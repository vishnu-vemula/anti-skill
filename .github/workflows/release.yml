name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Bundle and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate before bundling
        run: python scripts/validate_skills.py --strict --check-readme

      - name: Bundle skills
        run: |
          mkdir -p dist
          zip -r dist/antiskill-skills.zip skills/ README.md LICENSE
          sha256sum dist/antiskill-skills.zip > dist/antiskill-skills.zip.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/antiskill-skills.zip
            dist/antiskill-skills.zip.sha256
